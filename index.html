<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videy Clean White</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff;
}

/* HEADER */
.header{
    padding:15px;
    border-bottom:1px solid #ddd;
    font-size:20px;
    font-weight:bold;
}

/* HALAMAN AWAL */
.start-screen{
    text-align:center;
    padding:60px 20px;
}

.start-btn{
    margin-top:20px;
    background:black;
    color:white;
    border:none;
    padding:14px 25px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}

/* CONTAINER VIDEO */
.video-container{
    display:none;
    width:100%;
    max-width:400px;
    margin:20px auto 100px;
    padding:0 10px;
    box-sizing:border-box;
}

/* FOTO */
.fake-video{
    width:100%;
    aspect-ratio:9 / 16;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    background:black;
}

/* GAMBAR */
.fake-video img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* TOMBOL PLAY */
.play-button{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    
    width:90px;
    height:90px;

    background:rgba(0,0,0,0.65);
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:10;
}

/* ICON PLAY */
.play-button::before{
    content:"";
    margin-left:6px;

    border-style:solid;
    border-width:18px 0 18px 30px;
    border-color:transparent transparent transparent white;
}

/* BAR TELEGRAM */
.telegram-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#fff;
    border-top:1px solid #ddd;
    padding:10px;
    text-align:center;
    display:none;
}

.telegram-btn{
    background:#0088cc;
    color:white;
    padding:12px 20px;
    border-radius:25px;
    text-decoration:none;
    display:inline-block;
}

</style>
</head>

<body>

<div class="header">
    videy.co
</div>

<!-- HALAMAN AWAL -->
<div class="start-screen" id="startScreen">

    <h2>Lanjutkan Menonton Video?</h2>

    <p>Klik tombol di bawah untuk memulai.</p>

    <button class="start-btn" onclick="startVideo()">
        ▶ Mulai Menonton
    </button>

</div>

<!-- VIDEO -->
<div class="video-container" id="videoContainer">

    <div class="fake-video" id="fakeVideo">

        <!-- FOTO -->
        <img src="foto.jpg" alt="Thumbnail">

        <!-- TOMBOL PLAY -->
        <div class="play-button"></div>

    </div>

</div>

<!-- TELEGRAM -->
<div class="telegram-bar" id="telegramBar">

    <a href="#" class="telegram-btn" onclick="joinTelegram()">
        Join Telegram
    </a>

</div>

<script>

const ADS_LINK = "https://www.profitablecpmratenetwork.com/jc4bzkf1?key=51e86312c82641cb4638ec283e05655d";
const TELEGRAM_LINK = "https://www.profitablecpmratenetwork.com/jc4bzkf1?key=51e86312c82641cb4638ec283e05655d";

let lastAdTime = 0;

/* POPUP */
function showAds(){

    let now = Date.now();

    if(now - lastAdTime > 8000){

        lastAdTime = now;

        window.open(ADS_LINK, "_blank");
    }
}

/* START */
function startVideo(){

    showAds();

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("videoContainer").style.display = "block";

    document.getElementById("telegramBar").style.display = "block";
}

/* TELEGRAM */
function joinTelegram(){

    showAds();

    setTimeout(function(){

        window.open(TELEGRAM_LINK, "_blank");

    },1000);
}

/* KLIK FOTO */
window.onload = function(){

    const fakeVideo = document.getElementById("fakeVideo");

    fakeVideo.addEventListener("click", function(){

        showAds();

    });

};

</script>

</body>
</html>
